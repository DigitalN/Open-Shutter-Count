name: New camera
description: Open Shutter Count couldn't read your camera, or its numbers look wrong.
title: "A camera: "
labels: ["camera"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping Open Shutter Count read more cameras. Each Canon body keeps its shutter count a little differently, and the log shows how yours answered.
  - type: input
    id: camera
    attributes:
      label: Camera
      description: The camera's model, for example "Canon R6 Mark II".
    validations:
      required: true
  - type: textarea
    id: app_said
    attributes:
      label: What the app said
      description: Open an Issue fills this in. If the numbers look wrong, say what you expected, and how many photos the camera has taken if you know.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Open an Issue fills this in. It has the camera's model, firmware and what it answered, your Mac's model and macOS version, and nothing that identifies you or your camera (no serial number).
      render: text
